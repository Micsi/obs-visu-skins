<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>obs Visu — Fixture-Wand</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #0f1115;
        color: #e7e9ee;
      }
      .fw-head {
        padding: 16px 20px;
      }
      .fw-head h1 {
        margin: 0;
        font-size: 18px;
      }
      .fw-sub {
        margin: 4px 0 0;
        opacity: 0.6;
        font-size: 13px;
      }
      .fw-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
        padding: 20px;
        align-items: start;
      }
      /* Listen-Skins (terminal) wollen volle Zeilenbreite, kein Raster. */
      .fw-grid.is-list {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .fw-cell {
        border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
        border-radius: 12px;
        padding: 12px;
      }
      /* Statusfarben sind theme-abhängig: die Zellen liegen IN der Skin-Wurzel,
         also mal auf dunklem, mal auf hellem Grund. Ein fester Rotton hält auf dem
         hellen Grund keine AA-Schwelle (2,1:1) — hier zwei Sätze, beide >= 4.5:1. */
      .fw-grid {
        --fw-bad: #ff8a8a;
        --fw-good: #7ee787;
      }
      .fw-grid[data-theme="light"] {
        --fw-bad: #a3162a;
        --fw-good: #1f6b2e;
      }
      .fw-cell.is-gap,
      .fw-cell.is-broken {
        border-color: var(--fw-bad, #ff8a8a);
      }
      .fw-cell.is-unsupported {
        border-style: dashed;
        opacity: 0.75;
      }
      .fw-cell-head {
        display: flex;
        gap: 8px;
        align-items: baseline;
        margin-bottom: 10px;
        font-size: 12px;
        opacity: 0.85;
      }
      .fw-type {
        font-weight: 600;
      }
      .fw-state {
        opacity: 0.55;
      }
      .fw-controls {
        display: flex;
        gap: 16px;
        margin-top: 10px;
        font-size: 13px;
      }
      .fw-controls select {
        font: inherit;
        margin-left: 4px;
      }
      /* Kopfzeile liegt immer auf dem dunklen Werkzeug-Grund (body #0f1115):
         #7ee787 = 10,4:1, #ff8a8a = 7,6:1. */
      .fw-good {
        color: #7ee787;
      }
      .fw-bad {
        color: #ff8a8a;
      }
      .fw-gap {
        color: var(--fw-bad, #ff8a8a);
        font-size: 13px;
        padding: 12px;
        border: 1px dashed currentColor;
        border-radius: 8px;
        text-align: center;
      }
      .fw-skip {
        font-size: 13px;
        padding: 12px;
        text-align: center;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
